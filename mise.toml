[tools]
godot = "4.7.2-stable"
"pipx:gdtoolkit" = "4.5.0"
jq = "1.8.2"

[tasks.check]
description = "Full local verification: lint, GUT tests, smoke run of the demo scenes"
depends = ["lint", "test", "smoke"]

[tasks.import]
description = "Re-import when a script was added, removed or changed since the last import (class_name cache)"
run = """
scripts=$(find . -name '*.gd' -not -path './addons/*' -not -path './.godot/*' | sort)
if [ -f .godot/last_import ] && [ "$scripts" = "$(cat .godot/last_import)" ] &&
  [ -z "$(find . -name '*.gd' -not -path './addons/*' -newer .godot/last_import -print -quit)" ]; then
  exit 0
fi
godot --headless --import --path .
printf '%s\\n' "$scripts" > .godot/last_import
"""

[tasks.test]
description = "Run GUT headless; GUT hangs if its post-run hook fails to parse, so check that first"
depends = ["import"]
run = [
  "godot --headless --path . --check-only -s tests/gut_post_run.gd",
  "timeout 120 godot --headless -s --path . addons/gut/gut_cmdln.gd",
]

[tasks.lint]
description = "Check GDScript formatting and lint rules outside addons/"
run = ["gdformat --check src scenes tests tools", "gdlint src scenes tests tools"]

[tasks.smoke]
description = "Run every scenes/main_*.tscn headless for 120 frames; fail on a non-zero exit or any error line"
depends = ["import"]
run = """
status=0
for scene in scenes/main_*.tscn; do
  rc=0
  out=$(timeout 120 godot --headless --path . --log-file "${TMPDIR:-/tmp}/godot-smoke.log" --quit-after 120 "res://$scene" 2>&1) || rc=$?
  errors=$(printf '%s\\n' "$out" | grep -E '^(USER )?(SCRIPT )?ERROR' || true)
  if [ "$rc" -ne 0 ] || [ -n "$errors" ]; then
    printf 'smoke failed: %s (exit %s)\\n%s\\n' "$scene" "$rc" "$errors" >&2
    status=1
  fi
done
exit $status
"""
