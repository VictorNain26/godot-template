[tools]
godot = "4.7.2-stable"
"pipx:gdtoolkit" = "4.5.0"
jq = "1.8.2"

[tasks.check]
description = "Full local verification: lint, compile everything, GdUnit4 tests, smoke run of every scene"
depends = ["lint", "validate", "test", "smoke"]

[tasks.import]
description = "Re-import when tools/import_fingerprint.sh differs from the last import"
run = """
[ -f .godot/last_import ] && [ "$(tools/import_fingerprint.sh)" = "$(cat .godot/last_import)" ] && exit 0
godot --headless --import --path .
tools/import_fingerprint.sh > .godot/last_import
"""

[tasks.validate]
description = "Load every script, scene and shader with the autoloads registered; fail on the first that does not compile"
depends = ["import"]
run = "godot --headless --path . -s res://tools/validate.gd"

[tasks.test]
description = "Run GdUnit4 headless on tests/, addons/kit/tests/ and addons/kit_ui/tests/ (tools/gdunit.sh res://tests/test_x.gd for one file)"
depends = ["import"]
wait_for = ["validate"]
run = "tools/gdunit.sh"

[tasks.lint]
description = "Check GDScript formatting and lint rules: the project and the kit, not the vendored addons"
run = [
  "gdformat --check src scenes tests tools $(ls -d addons/kit addons/kit_* 2>/dev/null) kit_config.gd",
  "gdlint src scenes tests tools $(ls -d addons/kit addons/kit_* 2>/dev/null) kit_config.gd",
]

[tasks.smoke]
description = "Run every scene of scenes/ through tools/smoke.sh"
depends = ["import"]
# check runs test and smoke together: keep one Godot at a time on the project.
wait_for = ["validate", "test"]
run = """
status=0
for scene in scenes/*.tscn; do
  tools/smoke.sh "$scene" godot --path . "res://$scene" || status=1
done
exit $status
"""

[tasks.export-templates]
description = "Download, SHA512-check and install the official export templates of the pinned Godot (skipped if installed)"
run = """
version=$(tools/godot_version.sh)
dir="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates/$version"
[ -f "$dir/linux_release.x86_64" ] && [ -f "$dir/windows_release_x86_64.exe" ] && [ -f "$dir/web_nothreads_release.zip" ] && exit 0
tpz="Godot_v${version%.stable}-stable_export_templates.tpz"
base="https://github.com/godotengine/godot/releases/download/${version%.stable}-stable"
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
cd "$work"
curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
curl -fsSL -o "$tpz" "$base/$tpz"
grep " $tpz\\$" SHA512-SUMS.txt | sha512sum -c --strict -
mkdir -p "$dir"
unzip -q -j -o "$tpz" templates/version.txt templates/linux_release.x86_64 \
  templates/windows_release_x86_64.exe templates/web_nothreads_release.zip -d "$dir"
"""

[tasks.editor]
description = "From WSL: install the pinned Godot for Windows (SHA512-checked, skipped if present) and open this project in it"
run = """
version=$(tools/godot_version.sh)
release="${version%.stable}-stable"
zip="Godot_v${release}_win64.exe.zip"
local_appdata=$(cd /mnt/c && cmd.exe /c 'echo %LOCALAPPDATA%' | tr -d '\\r')
dir="$(wslpath "$local_appdata")/Programs/godot/$release"
exe="$dir/Godot_v${release}_win64.exe"
if [ ! -f "$exe" ]; then
  base="https://github.com/godotengine/godot/releases/download/$release"
  work=$(mktemp -d)
  trap 'rm -rf "$work"' EXIT
  curl -fsSL -o "$work/SHA512-SUMS.txt" "$base/SHA512-SUMS.txt"
  curl -fsSL -o "$work/$zip" "$base/$zip"
  (cd "$work" && grep " $zip\\$" SHA512-SUMS.txt | sha512sum -c --strict -)
  mkdir -p "$dir"
  unzip -q -o "$work/$zip" -d "$dir"
fi
# Start from a neutral Windows directory: the Godot AI dock's Configure runs
# `claude mcp remove --scope project` in the editor's working directory
# (addons/godot_ai/clients/claude_code.gd), which would empty this .mcp.json.
project=$(wslpath -w "$PWD")
(cd "$dir" && nohup "$exe" -e --path "$project" >/dev/null 2>&1 &)
echo "Godot $release for Windows opened on $project"
"""

[tasks.export]
description = "Export the Linux, Windows and web release builds to build/"
depends = ["import", "export-templates"]
run = """
rm -rf build
mkdir -p build/linux build/windows build/web
# Keeps Godot from importing what it has just exported.
touch build/.gdignore
godot --headless --path . --export-release "Linux" build/linux/game.x86_64
godot --headless --path . --export-release "Windows Desktop" build/windows/game.exe
godot --headless --path . --export-release "Web" build/web/index.html
"""

[tasks.export-smoke]
description = "Run the exported Linux build's self-test: translations, fonts, every scene (SELFTEST OK)"
run = """
out=$(timeout 300 build/linux/game.x86_64 --headless -- --selftest 2>&1)
printf '%s\n' "$out" | grep -E "SELFTEST|ERROR" | head -20
printf '%s\n' "$out" | grep -q "SELFTEST OK"
"""

[tasks.web-smoke]
description = "Load the web build in a headless Chromium (pip install playwright) and save build/web_smoke.png"
run = "python3 tools/web_smoke.py"

[tasks.kit-core-check]
description = "Prove the kit works for a game without the kit's menus: a scratch game from tools/kit_core_fixture, its tests, self-test and clicks (KIT CORE CHECK OK)"
run = "tools/kit_core_check.sh"

[tasks.mouse-check]
description = "Click through the game menus (kit config mouse_check) with real mouse events under Xvfb (MOUSE CHECK OK)"
depends = ["import"]
run = """
out=$(timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-driver opengl3 res://addons/kit/dev/mouse_check.tscn 2>&1) || true
if printf '%s\n' "$out" | grep -q "MOUSE CHECK OK"; then
  echo "MOUSE CHECK OK"
else
  # Nothing printed usually means no window or no OpenGL: show why.
  printf '%s\n' "$out" | tail -30
  exit 1
fi
"""

[tasks.shots]
description = "Save pictures of the title, the options, a demo and its pause to build/shots (OUT=dir), under Xvfb"
depends = ["import"]
run = "timeout 300 xvfb-run -a godot --path . --rendering-driver opengl3 res://tools/shots/shots.tscn 2>&1 | grep -E 'SHOT|SCRIPT ERROR'"

[tasks.kit-update]
description = "Pull the latest kit (addons/kit) and, if the game keeps them, its menus (addons/kit_ui) from godot-template's main with git subtree"
run = """
set -e
url=${KIT_TEMPLATE_URL:-https://github.com/VictorNain26/godot-template.git}
# The template is where the kit is made: there is nothing to pull into it.
case "$(git remote get-url origin 2>/dev/null)" in
*/godot-template | */godot-template.git) echo "this is the kit's source repository: nothing to pull" >&2; exit 1 ;;
esac
git diff --quiet && git diff --cached --quiet || { echo "commit or stash your changes first" >&2; exit 1; }
git remote get-url template >/dev/null 2>&1 || git remote add template "$url"
git fetch template main
pulled() { git log --grep="^git-subtree-dir: $1"'$' --format=%H -1 | grep -q .; }
# The menus come along if the game has them, or had them inside addons/kit
# (the layout before they moved out): a game that deleted them stays without.
prefixes="addons/kit"
if [ -d addons/kit_ui ] || [ -d addons/kit/ui ]; then
  prefixes="$prefixes addons/kit_ui"
fi
moved=false
[ -d addons/kit/ui ] && [ ! -d addons/kit_ui ] && moved=true
# Split where the prefix exists: subtree refuses a prefix the work tree lacks.
tmp=$(mktemp -d)
git worktree add -q --detach "$tmp" template/main
for prefix in $prefixes; do
  if [ ! -d "$tmp/$prefix" ]; then
    echo "$prefix is not in the template's main: skipped" >&2
    continue
  fi
  split=$(git -C "$tmp" subtree split --prefix="$prefix" HEAD)
  if pulled "$prefix"; then
    git subtree merge --prefix="$prefix" "$split" --squash -m "chore: $prefix from godot-template"
  else
    # A game made from the template holds the kit as plain files: hand it to subtree once.
    if [ -d "$prefix" ]; then
      git rm -rq "$prefix"
      git commit -qm "chore: $prefix is now pulled from godot-template"
    fi
    git subtree add --prefix="$prefix" "$split" --squash -m "chore: $prefix from godot-template"
  fi
done
git worktree remove --force "$tmp"
if $moved; then
  echo "The kit's menus moved to addons/kit_ui: in project.godot, point gui/theme/custom_font and the kit's en.po at addons/kit_ui, add addons/kit_ui/tests/* to the exports' exclude_filter and addons/kit_ui/fonts/*.txt to their include_filter, then run mise run check." >&2
fi
"""
